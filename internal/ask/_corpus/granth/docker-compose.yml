# Local development stack. Every port is published on 127.0.0.1 only.
# Copy .env.example to .env and set the passwords first.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: granth
      POSTGRES_DB: granth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "granth"]
      interval: 5s

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
      # The security plugin stays on: HTTPS with basic auth.
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?set OPENSEARCH_PASSWORD in .env}
    ports: ["127.0.0.1:9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]

  temporal:
    image: temporalio/temporal:1.4.1
    # Binds 0.0.0.0 inside the container so the published 127.0.0.1 ports work.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports: ["127.0.0.1:7233:7233", "127.0.0.1:8233:8233"]
    volumes: [temporal:/data]

volumes: {pgdata: {}, osdata: {}, temporal: {}}
